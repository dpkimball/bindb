name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: bindb-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: bindb

      - uses: actions/checkout@v4
        with:
          repository: dpkimball/dpk-build
          path: dpk-build

      - name: cargo fmt
        run: cargo fmt -- --check
        working-directory: bindb

      - name: make b
        run: CI=true make b
        working-directory: bindb
        env:
          BUILD_ROOT: ${{ github.workspace }}/dpk-build
