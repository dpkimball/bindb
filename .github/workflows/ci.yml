name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: bindb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pin until dpk-ci #211 (product-ci / ci-wait pools) lands on master; then
    # switch back to @master with runner: product-ci.
    uses: dpkimball/dpk-ci/.github/workflows/rust-library-ci.yml@fix/issue-211-ci-wait-orchestration-pool
    with:
      project_name: bindb
      runner: product-ci
    secrets: inherit
