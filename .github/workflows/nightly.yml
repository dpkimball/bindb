name: Nightly XL

# Runs XL-scale (1 M objects) SLA tests on the self-hosted runner.
# Failures are detected by nightly_watchdog.yml (02:45 UTC, ubuntu-latest)
# which opens a GitHub issue if this job is still queued, failed, or absent.

on:
  schedule:
    # 02:00 UTC every day — self-hosted runner must be online.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: bindb-nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── XL-scale SLA gate ────────────────────────────────────────────────────────
  # Validates performance at 1 M objects. Not run on every PR because build +
  # store setup takes 5–20 minutes per test; a nightly job is sufficient.
  xl_sla:
    name: XL scale SLA
    runs-on: product-ci
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: L SLA tests (scale:L)
        run: |
          cargo test --release --test perf_sla \
            -- --ignored --test-threads=1 sla_l_

      - name: XL SLA tests (scale:XL)
        run: |
          cargo test --release --test perf_sla \
            -- --ignored --test-threads=1 sla_xl_
