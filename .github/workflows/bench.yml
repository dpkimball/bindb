name: Perf

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

concurrency:
  group: bindb-perf-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── SLA gate ────────────────────────────────────────────────────────────────
  # Fails the PR if any SLA threshold in tests/perf_sla.rs is violated.
  # On master push: publishes a new perf-report-latest.json to gh-pages so
  # future PRs have a baseline to compare against.
  # On labeled PRs: fetches the master baseline, computes a delta table, and
  # posts (or updates) a PR comment via scripts/compare_perf.py.
  sla:
    name: SLA gate
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: write      # fetch / push gh-pages baseline
      pull-requests: write # post delta comment on PRs
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'performance')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SLA tests (--release, --ignored)
        # Scope to perf_sla only: `cargo test -- --ignored` also executes
        # rustdoc ```ignore``` examples, which are documentation stubs.
        run: cargo test --release --test perf_sla -- --ignored --test-threads=1

      - name: Generate perf report (measured vs SLA)
        env:
          PERF_REPORT_DIR: perf-out
          # Soft: always upload artifact even if a noisy metric (e.g. open()) fails locally.
          # The SLA gate above remains the hard fail.
          PERF_REPORT_SOFT: "1"
        run: |
          set -euo pipefail
          mkdir -p perf-out
          cargo run --example perf_report --release
          echo "----- perf-report.md -----"
          cat perf-out/perf-report.md

      - name: Upload perf report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.run_id }}
          path: |
            perf-out/perf-report.md
            perf-out/perf-report.json
          if-no-files-found: warn

      # ── baseline maintenance (master push only) ───────────────────────────
      - name: Publish baseline to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          git worktree add /tmp/gh-pages gh-pages

          # Update rolling history: append current run, keep last 10 entries.
          python3 scripts/update_perf_history.py \
            /tmp/gh-pages/perf-history.json perf-out/perf-report.json

          cp perf-out/perf-report.json /tmp/gh-pages/perf-report-latest.json
          cd /tmp/gh-pages
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add perf-report-latest.json perf-history.json
          git diff --cached --quiet || git commit -m "perf: update baseline from ${{ github.sha }}"
          git push origin gh-pages

      # ── delta comment (labeled PRs only) ─────────────────────────────────
      - name: Fetch baseline from gh-pages
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          git show gh-pages:perf-report-latest.json > /tmp/perf-baseline.json 2>/dev/null \
            || echo '{}' > /tmp/perf-baseline.json
          git show gh-pages:perf-history.json > /tmp/perf-history.json 2>/dev/null \
            || echo '[]' > /tmp/perf-history.json
          # If no history on gh-pages yet, seed with the master baseline so the
          # history table is never empty on the first run.
          python3 scripts/update_perf_history.py \
            --seed-if-empty /tmp/perf-history.json /tmp/perf-baseline.json

      - name: Generate delta comment
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Build a PR-local view: master history + this PR's run (newest entry).
          # We don't push this back to gh-pages; it's only for the comment.
          cp /tmp/perf-history.json /tmp/perf-history-pr.json
          python3 scripts/update_perf_history.py \
            /tmp/perf-history-pr.json perf-out/perf-report.json
          python3 scripts/compare_perf.py \
            /tmp/perf-baseline.json perf-out/perf-report.json /tmp/perf-history-pr.json \
            > /tmp/perf-delta.md
          echo "=== delta comment ==="
          cat /tmp/perf-delta.md

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bindb-perf-delta -->';
            const delta = fs.readFileSync('/tmp/perf-delta.md', 'utf8');
            const body = marker + '\n' + delta;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── trend benchmarks ────────────────────────────────────────────────────────
  # Runs criterion and stores results for PR comment comparison.
  # Does NOT fail the PR — provides visibility only.
  # Baseline accumulates from pushes to master; PRs are compared against it.
  benchmark:
    name: Benchmark trends
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'performance')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure local gh-pages ref
        run: |
          set -euo pipefail
          git fetch origin gh-pages:gh-pages 2>/dev/null \
            || git fetch origin gh-pages \
            || {
              echo "gh-pages missing remotely; creating orphan local branch" >&2
              git switch --orphan gh-pages
              git commit --allow-empty -m "init gh-pages"
              git switch -
            }

      - name: Run criterion benchmarks
        run: >
          cargo bench --bench store_bench
          -- --output-format bencher
          --measurement-time 3
          --warm-up-time 1
          | tee bench_output.txt

      - name: Store / compare benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: bindb benchmarks
          tool: cargo
          output-file-path: bench_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Push new baseline only on pushes to master.
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # Post a PR comment showing delta from master baseline.
          comment-on-alert: true
          # Flag (but don't fail) if a benchmark regresses more than 3×.
          # durable-commit benchmarks are fsync-latency-bound and highly variable
          # on shared runners; 200% avoids false alerts from runner preemption.
          alert-threshold: "300%"
          fail-on-alert: false
          # Store baseline data in the gh-pages branch.
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
