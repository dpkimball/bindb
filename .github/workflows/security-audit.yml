# Consumer workflow: thin call into dpk-ci security-audit-dispatch.
# Scan implementation and isolated runners live in dpkimball/security-audit.
# Generated from security-audit/workflows/templates/security-audit-pr.yml — prefer sync-pr-workflows.py.

name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.rst"
      - "**/*.txt"
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  security-audit:
    uses: dpkimball/dpk-ci/.github/workflows/security-audit-dispatch.yml@fix/issue-211-ci-wait-orchestration-pool
    with:
      repository_name: bindb
      github_repository: dpkimball/bindb
      classification: high
      runner: product-ci
    secrets: inherit
