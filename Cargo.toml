[package]
name = "bindb"
version = "0.1.2"
edition = "2021"
rust-version = "1.82"
authors = ["DPK Platform Team"]
license = "MIT"
description = "Bindb — append-only WAL store for Binder domain objects, edges, and versions"
repository = "https://github.com/dpkimball/bindb"
homepage = "https://github.com/dpkimball/bindb-releases"
readme = "README.md"
# Private Kellnr registry only — never crates.io (binder-sdk's "Private :: Do Not Upload").
publish = ["dpk"]

[[bin]]
name = "bindb"
path = "src/bin/bindb.rs"

[dependencies]
ulid = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bincode = "1"
crc32fast = "1"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "store_bench"
harness = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
